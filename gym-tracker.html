/* ────────────────────────────────────────────
   GITHUB GIST SYNC
   ──────────────────────────────────────────── */

const SYNC_KEY = 'gymlog.sync';
const GIST_FILENAME = 'gymlog.json';

const syncConfig = {
  token: '',
  gistId: '',
  autoSync: false,
  lastSyncedAt: null,
};

let autoSyncTimer = null;
let syncing = false;

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_KEY);
    if (raw) Object.assign(syncConfig, JSON.parse(raw));
  } catch (e) {
    console.warn('Failed to load sync config:', e);
  }
}

function saveSyncConfig() {
  try {
    localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig));
  } catch (e) {
    console.warn('Failed to save sync config:', e);
  }
}

function setSyncStatus(text, kind) {
  const el = $('#sync-status');
  if (el) {
    el.textContent = text;
    el.classList.remove('ok', 'err', 'busy');
    if (kind) el.classList.add(kind);
  }
}

function setSyncLast() {
  const el = $('#sync-last');
  if (!el) return;
  if (!syncConfig.lastSyncedAt) {
    el.textContent = 'Last synced: never';
    return;
  }
  const ago = relativeTime(syncConfig.lastSyncedAt);
  el.textContent = `Last synced: ${ago}`;
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const diff = Math.max(0, Date.now() - then);
  const sec = Math.floor(diff / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min} min${min === 1 ? '' : 's'} ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} hour${hr === 1 ? '' : 's'} ago`;
  const days = Math.floor(hr / 24);
  if (days < 30) return `${days} day${days === 1 ? '' : 's'} ago`;
  return new Date(iso).toLocaleDateString();
}

async function ghFetch(path, options = {}) {
  if (!syncConfig.token) throw new Error('No GitHub token configured');
  const res = await fetch(`https://api.github.com${path}`, {
    ...options,
    headers: {
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Authorization': `Bearer ${syncConfig.token}`,
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.message ? `: ${j.message}` : ''; } catch {}
    throw new Error(`GitHub ${res.status}${detail}`);
  }
  return res.json();
}

async function findExistingGist() {
  if (syncConfig.gistId) return syncConfig.gistId;
  // Look for an existing gist with our filename in user's first 100 gists.
  const gists = await ghFetch('/gists?per_page=100');
  const found = gists.find(g => g.files && g.files[GIST_FILENAME]);
  if (found) {
    syncConfig.gistId = found.id;
    saveSyncConfig();
    return found.id;
  }
  return null;
}

async function findOrCreateGist() {
  const existing = await findExistingGist();
  if (existing) return existing;
  const data = await ghFetch('/gists', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: 'GymLog workout data',
      public: false,
      files: {
        [GIST_FILENAME]: { content: JSON.stringify(buildExportPayload(), null, 2) },
      },
    }),
  });
  syncConfig.gistId = data.id;
  saveSyncConfig();
  return data.id;
}

async function pushToGist({ silent = false } = {}) {
  if (syncing) return;
  if (!syncConfig.token) {
    if (!silent) alert('Add a GitHub token first.');
    return;
  }
  syncing = true;
  if (!silent) setSyncStatus('Syncing…', 'busy');
  try {
    const id = await findOrCreateGist();
    const content = JSON.stringify(buildExportPayload(), null, 2);
    await ghFetch(`/gists/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content } } }),
    });
    syncConfig.lastSyncedAt = new Date().toISOString();
    saveSyncConfig();
    if (!silent) {
      setSyncStatus('Synced', 'ok');
      showInfoToast('Pushed to Gist');
    }
    setSyncLast();
    // Keep status fresh in the field
    const idInput = $('#sync-gist-id');
    if (idInput && !idInput.value) idInput.value = syncConfig.gistId;
  } catch (e) {
    console.error(e);
    if (!silent) {
      setSyncStatus('Failed', 'err');
      showInfoToast('Sync failed: ' + e.message);
    }
  } finally {
    syncing = false;
  }
}

async function pullFromGist() {
  if (syncing) return;
  if (!syncConfig.token) { alert('Add a GitHub token first.'); return; }
  syncing = true;
  setSyncStatus('Pulling…', 'busy');
  try {
    const id = await findExistingGist();
    if (!id) throw new Error(`No "${GIST_FILENAME}" gist on this account. Push from another device first, or paste the Gist ID.`);
    const gist = await ghFetch(`/gists/${id}`);
    const file = gist.files && gist.files[GIST_FILENAME];
    if (!file) throw new Error(`Gist has no ${GIST_FILENAME}`);
    let content = file.content;
    if (file.truncated && file.raw_url) {
      const raw = await fetch(file.raw_url);
      content = await raw.text();
    }
    const parsed = JSON.parse(content);
    const ok = applyImportedData(parsed, { confirmFirst: true });
    if (!ok) { setSyncStatus('Cancelled'); return; }
    syncConfig.lastSyncedAt = new Date().toISOString();
    saveSyncConfig();
    setSyncStatus('Synced', 'ok');
    setSyncLast();
    showInfoToast('Pulled from Gist');
    // Reflect the now-known gist ID in the input
    const idInput = $('#sync-gist-id');
    if (idInput) idInput.value = syncConfig.gistId;
  } catch (e) {
    console.error(e);
    setSyncStatus('Failed', 'err');
    showInfoToast('Sync failed: ' + e.message);
  } finally {
    syncing = false;
  }
}

function scheduleAutoSync() {
  if (!syncConfig.autoSync || !syncConfig.token) return;
  if (autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(() => {
    pushToGist({ silent: true }).catch(e => console.warn('Auto-sync failed:', e));
  }, 2500);
}

/* ────────────────────────────────────────────
   RENDER
   ──────────────────────────────────────────── */

function render() {
  renderTopStats();
  renderTabs();
  renderPage();
  if (pendingFocus) {
    const el = document.querySelector(pendingFocus);
    if (el) {
      el.focus();
      if (typeof el.select === 'function') el.select();
    }
    pendingFocus = null;
  }
}

function renderTopStats() {
  $('#stat-sessions').textContent = state.sessions.length;
  $('#stat-volume').textContent = formatVolume(recentVolume(7));
}

function renderTabs() {
  // Records lives inside History, settings is reached via the gear.
  // Bottom nav and top tabs reflect the current top-level page; gear
  // gets its own active state.
  const navView = state.view === 'records' ? 'history' : state.view;
  $$('.tab').forEach(el => el.classList.toggle('active', el.dataset.view === navView));
  $$('.bottom-nav-btn').forEach(el => el.classList.toggle('active', el.dataset.view === navView));
  $$('.topbar-icon-btn').forEach(el => el.classList.toggle('active', el.dataset.view === state.view));
}

function renderPage() {
  const page = $('#page');
  // Reset scroll on view change so each page starts at top.
  page.scrollTop = 0;
  switch (state.view) {
    case 'home':     page.innerHTML = renderHome();     attachHomeHandlers(); break;
    case 'train':    page.innerHTML = renderTrain();    attachTrainHandlers(); break;
    case 'history':  page.innerHTML = renderHistory();  attachHistoryHandlers(); break;
    case 'routine':  page.innerHTML = renderRoutine();  attachRoutineHandlers(); break;
    case 'settings': page.innerHTML = renderSettings(); attachSettingsHandlers(); break;
  }
}

function renderHomeHero() {

    action = 'resume';
    const completed = sessionCompletedSets(draft);
    const total = sessionTotalSets(draft);
    sub = `Unsaved draft · ${completed}/${total} sets done — finish & tap Log Session`;
  } else if (activeSession) {
    label = `Resume ${activeSession.dayName?.trim() || 'workout'}`;
    action = 'resume';
    const completed = sessionCompletedSets(activeSession);
    const total = sessionTotalSets(activeSession);
    sub = `In progress · ${completed}/${total} sets done`;

    label = `Start ${todaysDay.name}`;
    action = 'start-today';
    const n = todaysDay.exercises.length;
    sub = `Today's plan: ${n} ${n === 1 ? 'exercise' : 'exercises'} — pre-fills as a draft you can save when done`;
  } else if (state.split.days.length) {
    label = 'Start a workout';
    action = 'go-train';
    sub = `No day assigned to ${DOW_LABELS[new Date().getDay()]}. Pick from your split.`;
  } else {
    label = 'Set up your split';
    action = 'go-split';
    sub = `Build your weekly routine first.`;
  }

  return `

function renderCalendar() {
  const [year, month] = calendarMonth.split('-').map(Number);
  const firstDay = new Date(year, month - 1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const startDow = (firstDay.getDay() + 6) % 7; // Mon=0..Sun=6
  const dates = new Set(state.sessions.map(s => s.date));
  const today = todayISO();

  let cells = '';

  // Pad with previous month's tail
  const prevLastDay = new Date(year, month - 1, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    const day = prevLastDay - i;
    const m = month === 1 ? 12 : month - 1;
    const y = month === 1 ? year - 1 : year;
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    cells += renderCalCell(iso, day, true, dates.has(iso), false, false);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    cells += renderCalCell(iso, day, false, dates.has(iso), iso === today, iso === selectedDate);
  }

  // Pad to fill the last row
  const used = startDow + daysInMonth;
  const remaining = (7 - (used % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    const m = month === 12 ? 1 : month + 1;
    const y = month === 12 ? year + 1 : year;
    const iso = `${y}-${String(m).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
    cells += renderCalCell(iso, i, true, dates.has(iso), false, false);
  }

  const monthLabel = firstDay.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  return `
    <div class="calendar">
      <div class="calendar-header">
        <button class="cal-nav" data-cal-nav="-1" aria-label="Previous month">
          <svg viewBox="0 0 24 24"><use href="#icon-arrow-left"/></svg>
        </button>
        <div class="cal-title">${escapeHtml(monthLabel)}</div>
        <button class="cal-nav" data-cal-nav="1" aria-label="Next month">
          <svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><use href="#icon-arrow-left"/></svg>
        </button>
      </div>
      <div class="cal-weekdays">
        <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>`;
}

function renderCalCell(iso, day, muted, hasWorkout, isToday, isSelected) {
  const cls = ['cal-day'];
  if (muted) cls.push('muted');
  if (hasWorkout) cls.push('has-workout');
  if (isToday) cls.push('today');
  if (isSelected) cls.push('selected');
  return `
    <button class="${cls.join(' ')}" data-cal-day="${iso}" ${muted ? 'tabindex="-1"' : ''} aria-label="${escapeHtml(formatDateLong(iso))}${hasWorkout ? ' (workout logged)' : ''}">
      <span class="cal-day-num">${day}</span>
      ${hasWorkout ? '<span class="cal-day-dot"></span>' : ''}

}

  // Header buttons differ for drafts vs saved sessions.
  const headerLeft = isDraft

         <svg viewBox="0 0 24 24"><use href="#icon-arrow-left"/></svg>
         End workout

  const headerRight = isDraft

       </button>`;

  const draftBanner = isDraft
    ? `<div class="draft-banner">

function renderSessionExercise(session, ex) {
  const volume = exerciseVolume(ex);
  const allDone = ex.sets.length > 0 && ex.sets.every(s => s.complete);
  const hitPB = exerciseHasPBInSession(session, ex);

  // PB display logic
  let pbHtml = '';
  if (ex.name?.trim()) {
    const prevPB = priorBestSet(session, ex.name);
    if (hitPB) {
      const curBest = sessionBestSetForEx(ex);
      if (curBest) {
        pbHtml = `
          <div class="exercise-pb new-pb">
            <svg class="exercise-pb-icon pb-flame" viewBox="0 0 24 24"><use href="#icon-flame"/></svg>
            New PB!  ${formatWeight(curBest.weight)} kg × ${curBest.reps}
          </div>`;
      }
    } else if (prevPB) {
      pbHtml = `
        <div class="exercise-pb">
          <svg class="exercise-pb-icon" viewBox="0 0 24 24"><use href="#icon-trophy"/></svg>
          PB to beat: ${formatWeight(prevPB.weight)} kg × ${prevPB.reps}
        </div>`;
    } else {
      pbHtml = `<div class="exercise-pb">No PB yet — set one today.</div>`;
    }
  }

  const cardClass = ['exercise', allDone ? 'all-done' : '', hitPB ? 'has-pb' : ''].filter(Boolean).join(' ');

  return `
    <div class="${cardClass}" data-exercise-id="${ex.id}">
      <div class="exercise-header">
        <input
          type="text"
          class="exercise-name-input"
          value="${escapeHtml(ex.name)}"
          placeholder="Exercise name"
          data-edit-exercise="${ex.id}"
          autocomplete="off"
        />
        <div class="exercise-meta">
          <span class="exercise-volume" data-exercise-volume="${ex.id}">${formatVolume(volume)} kg</span>
          <button class="icon-btn danger" data-delete-exercise="${ex.id}" title="Delete exercise">
            <svg viewBox="0 0 24 24"><use href="#icon-trash"/></svg>
          </button>
        </div>
      </div>

      ${pbHtml}

      <div class="sets">
        <div class="sets-header">
          <div>Set</div>
          <div>Reps</div>
          <div class="weight-pair-headers">
            <div>Weight</div>
            <div></div>
            <div>Plates</div>
          </div>
          <div>Vol</div>
          <div></div>
          <div></div>
        </div>
        ${ex.sets.map((set, i) => renderSessionSet(session, ex, set, i + 1)).join('')}

      <button class="btn btn-ghost btn-sm" data-add-set="${ex.id}">
        <svg viewBox="0 0 24 24" width="12" height="12"><use href="#icon-plus"/></svg>

}

function renderSessionSet(session, ex, set, num) {
  const reps = Number(set.reps) || 0;
  const total = setWeight(set);
  const volume = reps * total;
  const isPB = isPBSet(session, ex, set);
  const cls = ['set', set.complete ? 'complete' : '', isPB ? 'is-pb' : ''].filter(Boolean).join(' ');
  const machineVal = set.machineWeight === '' || set.machineWeight == null ? '' : escapeHtml(String(set.machineWeight));
  const plateVal   = set.plateWeight   === '' || set.plateWeight   == null ? '' : escapeHtml(String(set.plateWeight));
  return `
    <div class="${cls}" data-set-id="${set.id}" data-exercise-id="${ex.id}">
      <div class="set-num">${num}</div>
      <input type="number" class="set-input" min="0" step="1" inputmode="numeric"
        value="${set.reps === '' || set.reps == null ? '' : escapeHtml(String(set.reps))}"
        placeholder="0"
        data-set-field="reps" data-exercise-id="${ex.id}" data-set-id="${set.id}"
        aria-label="Reps for set ${num}" />
      <div class="weight-pair">
        <input type="number" class="set-input weight-machine" min="0" step="0.5" inputmode="decimal"
          value="${machineVal}" placeholder="0"
          data-set-field="machineWeight" data-exercise-id="${ex.id}" data-set-id="${set.id}"
          aria-label="Weight for set ${num}" />
        <span class="weight-pair-plus">+</span>
        <input type="number" class="set-input weight-plate" min="0" step="0.25" inputmode="decimal"
          value="${plateVal}" placeholder="0"
          data-set-field="plateWeight" data-exercise-id="${ex.id}" data-set-id="${set.id}"
          aria-label="Additional plates for set ${num}" />
      </div>
      <div class="set-volume" data-set-volume>
        ${formatVolume(volume)}${isPB ? '<svg class="set-pb-marker" width="11" height="11" viewBox="0 0 24 24"><use href="#icon-flame"/></svg>' : ''}
      </div>
      <button class="check-btn ${set.complete ? 'checked' : ''}"
              data-toggle-set="${set.id}" data-exercise-id="${ex.id}" title="Mark complete">
        <svg viewBox="0 0 24 24"><use href="#icon-check"/></svg>
      </button>
      <button class="icon-btn danger" data-delete-set="${set.id}" data-exercise-id="${ex.id}" title="Delete set">
        <svg viewBox="0 0 24 24"><use href="#icon-x"/></svg>
      </button>
    </div>`;
}

function renderHistory() {

function renderSessionsBody() {
  if (!state.sessions.length) {
    return `
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 24 24"><use href="#icon-history"/></svg></div>
        <div class="empty-text">No history yet</div>
        <div class="empty-sub">Log your first session and it'll show up here.</div>
        <button class="btn btn-primary btn-lg" data-goto-train>Start a workout</button>
      </div>`;
  }

  const groups = new Map();
  for (const s of state.sessions) {
    const d = parseISO(s.date);
    const key = d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}` : 'Unknown';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }

  const keys = Array.from(groups.keys()).sort().reverse();
  return keys.map(key => {
    const sessions = groups.get(key);
    const [y, m] = key.split('-').map(Number);
    const label = key === 'Unknown'
      ? 'Unknown date'
      : new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    return `
      <div class="history-group">
        <div class="history-group-header">${escapeHtml(label)}</div>
        ${sessions.map(s => renderHistoryRow(s)).join('')}
      </div>`;
  }).join('');
}

function renderRecordsBody() {
  const allNames = getAllExerciseNames();
  if (!allNames.length) {
    return `
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 24 24"><use href="#icon-trophy"/></svg></div>
        <div class="empty-text">No records yet</div>
        <div class="empty-sub">Log a workout and your personal bests will appear here.</div>
        <button class="btn btn-primary btn-lg" data-goto-train>Start a workout</button>
      </div>`;
  }
  const q = recordsSearchQuery.trim().toLowerCase();
  const filtered = q ? allNames.filter(n => n.toLowerCase().includes(q)) : allNames;
  return `
    <input
      type="text"
      class="records-search"
      id="records-search"
      placeholder="Search exercises..."
      value="${escapeHtml(recordsSearchQuery)}"
    />
    <div class="records-grid">${recordRowsHtml(filtered)}</div>`;
}

function renderHistoryRow(s) {
  const totalSets = sessionTotalSets(s);
  const done = sessionCompletedSets(s);
  const vol = sessionVolume(s);
  const pbCount = sessionHitPBCount(s);
  const isComplete = totalSets > 0 && done === totalSets;
  const progressLabel = totalSets > 0 ? `${done}/${totalSets}` : '—';
  const d = parseISO(s.date);
  const dayLabel = d ? d.toLocaleDateString(undefined, { weekday: 'short' }) : '';
  const dayNum = d ? d.getDate() : '';
  const name = s.dayName?.trim() || formatDateLong(s.date);
  const isMuted = !s.dayName?.trim();

  return `
    <button class="history-row ${pbCount ? 'has-pb' : ''}" data-open-session="${s.id}">
      <div class="history-date">
        <div class="history-date-dow">${escapeHtml(dayLabel)}</div>
        <div class="history-date-num">${dayNum}</div>
      </div>
      <div class="history-main">
        <div class="history-name-row">
          <div class="history-name ${isMuted ? 'muted' : ''}">${escapeHtml(name)}</div>
          ${pbCount ? `<span class="history-pb-badge"><svg viewBox="0 0 24 24"><use href="#icon-flame"/></svg>${pbCount} PB${pbCount > 1 ? 's' : ''}</span>` : ''}
        </div>
        <div class="history-stats">${s.exercises.length} ex · ${totalSets} sets · ${sessionTotalReps(s)} reps</div>
      </div>
      <div class="history-side">
        <div class="history-volume">${formatVolume(vol)}<span class="unit"> kg</span></div>
        <div class="history-progress ${isComplete ? 'complete' : ''}">${progressLabel}</div>
      </div>
    </button>`;
}

/* ─── RECORDS ─── */

let recordsSearchQuery = '';

function getAllExerciseNames() {
  const names = new Map(); // norm -> displayName (most recent)
  for (const day of state.split.days) {
    for (const ex of day.exercises) {
      const n = (ex.name || '').trim();
      if (n) names.set(normalizeName(n), n);
    }
  }
  for (const session of state.sessions) {
    for (const ex of session.exercises) {
      const n = (ex.name || '').trim();
      if (n) names.set(normalizeName(n), n);
    }
  }
  return Array.from(names.values()).sort((a, b) => a.localeCompare(b));
}

function recordRowsHtml(names) {
  if (!names.length) {
    return '<div class="empty-state empty-state-sm"><div class="empty-text">No matches</div></div>';
  }
  return names.map(name => {
    const best = bestSetForExercise(name);
    const e1 = bestE1RMForExercise(name);
    if (!best) {
      return `
        <div class="record-row">
          <div class="record-name">${escapeHtml(name)}</div>
          <div class="record-stat"><div class="record-stat-label">Heaviest</div><div class="record-stat-value" style="color:var(--text-3)">—</div></div>
          <div class="record-stat"><div class="record-stat-label">Est. 1RM</div><div class="record-stat-value" style="color:var(--text-3)">—</div></div>
          <div class="record-date">No completed sets</div>
        </div>`;
    }
    const heaviestStr = best.plateWeight > 0
      ? `${formatWeight(best.machineWeight)} <span class="record-plus">+</span> ${formatWeight(best.plateWeight)}`
      : formatWeight(best.weight);
    const totalLine = best.plateWeight > 0
      ? `<div class="record-stat-breakdown">= ${formatWeight(best.weight)} kg total</div>`
      : '';
    return `
      <div class="record-row">
        <div class="record-name">${escapeHtml(name)}</div>
        <div class="record-stat">
          <div class="record-stat-label">Heaviest</div>
          <div class="record-stat-value gold">${heaviestStr}<span class="unit"> kg × ${best.reps}</span></div>
          ${totalLine}
        </div>
        <div class="record-stat">
          <div class="record-stat-label">Est. 1RM</div>
          <div class="record-stat-value">${formatWeight(e1.e1rm)}<span class="unit"> kg</span></div>
        </div>
        <div class="record-date">${escapeHtml(daysAgoText(best.date) || formatDateShort(best.date))}</div>
      </div>`;
  }).join('');
}

function renderRecords() {
  const allNames = getAllExerciseNames();
  const q = recordsSearchQuery.trim().toLowerCase();
  const filtered = q ? allNames.filter(n => n.toLowerCase().includes(q)) : allNames;

  if (!allNames.length) {
    return `
      <div class="empty-state">

        <div class="empty-text">No records yet</div>

  return `

      <div class="page-header">

          <div class="page-title">Personal Records</div>

             autocomplete="off" />
      <input type="number" class="routine-ex-num" min="1" max="99" step="1" inputmode="numeric"
             value="${ex.defaultSets ?? ''}" placeholder="3"
             data-routine-ex-field="defaultSets" data-day-id="${day.id}" data-ex-id="${ex.id}" />
      <input type="number" class="routine-ex-num" min="1" max="999" step="1" inputmode="numeric"
             value="${ex.defaultReps ?? ''}" placeholder="10"
             data-routine-ex-field="defaultReps" data-day-id="${day.id}" data-ex-id="${ex.id}" />
      <input type="number" class="routine-ex-num" min="0" step="0.5" inputmode="decimal"

      <input type="number" class="routine-ex-num" min="0" step="0.25" inputmode="decimal"

    .map(([v, l]) => `<option value="${v}" ${day.dayOfWeek === v || (v === '' && day.dayOfWeek == null) ? 'selected' : ''}>${l}</option>`)

  return `
    <div class="routine-day" data-day-id="${day.id}">

      <div class="routine-exercises">
        ${day.exercises.length ? `
          <div class="routine-ex-headers">
            <div>Exercise</div><div>Sets</div><div>Reps</div><div>Weight</div><div>Plates</div><div></div>
          </div>` : ''}
        ${exHtml}
        <button class="routine-add-ex-btn" data-add-routine-ex="${day.id}">
          <svg viewBox="0 0 24 24"><use href="#icon-plus"/></svg>
          Add Exercise
        </button>

}

function renderGistSyncSection() {
  const tokenSet = !!syncConfig.token;
  const linked = !!syncConfig.gistId;
  let statusText = 'Not configured';
  let statusKind = '';
  if (tokenSet && linked) { statusText = 'Linked'; statusKind = 'ok'; }
  else if (tokenSet)      { statusText = 'Ready';  statusKind = 'ok'; }

  return `
    <div class="settings-section">
      <div class="settings-section-row">
        <div>
          <div class="settings-section-title">GitHub Gist Sync</div>
          <div class="settings-section-sub">Sync data across devices via a private Gist.</div>
        </div>
        <div class="settings-section-status ${statusKind}" id="sync-status">${statusText}</div>
      </div>

      <details class="settings-help">
        <summary>How to set this up</summary>
        <ol>
          <li>Open <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">github.com/settings/tokens</a> and create a token. A <strong>fine-grained</strong> token works — under <em>Account permissions</em> set <code>Gists</code> to <strong>Read and write</strong>. Or use a classic token with the <code>gist</code> scope.</li>
          <li>Copy the token (starts with <code>github_pat_</code> or <code>ghp_</code>) and paste it below.</li>
          <li>Hit <strong>Push to Gist</strong> — the app creates a private Gist named <code>gymlog.json</code>. The Gist ID auto-fills.</li>
          <li>On another device: paste the same token (or token + Gist ID) and hit <strong>Pull from Gist</strong> to load.</li>
          <li>Turn on <em>Auto-sync</em> to push every change automatically (debounced).</li>
        </ol>
        <p style="margin-top:8px">The token lives only in this browser's localStorage and is sent only to <code>api.github.com</code>. It never reaches any other server.</p>
      </details>

      <div class="settings-field">
        <label for="sync-token">GitHub token</label>
        <div class="settings-input-row">
          <input type="password" class="settings-input" id="sync-token"
                 placeholder="github_pat_… or ghp_…"
                 autocomplete="off" spellcheck="false"
                 value="${escapeHtml(syncConfig.token)}" />
          <button class="icon-btn" id="sync-token-toggle" title="Show/hide token" aria-label="Show/hide token">
            <svg viewBox="0 0 24 24"><use href="#icon-eye"/></svg>
          </button>
        </div>
      </div>

      <div class="settings-field">
        <label for="sync-gist-id">Gist ID <span class="settings-field-hint">(auto-filled, or paste from another device)</span></label>
        <input type="text" class="settings-input" id="sync-gist-id"
               placeholder="e.g. 3a4f9b1c2d5e..."
               autocomplete="off" spellcheck="false"
               value="${escapeHtml(syncConfig.gistId)}" />
      </div>

      <div class="settings-actions">
        <button class="btn" id="sync-push">
          <svg viewBox="0 0 24 24" width="14" height="14"><use href="#icon-cloud-up"/></svg>
          Push to Gist
        </button>
        <button class="btn" id="sync-pull">
          <svg viewBox="0 0 24 24" width="14" height="14"><use href="#icon-cloud-down"/></svg>
          Pull from Gist
        </button>
      </div>

      <label class="settings-toggle" for="sync-auto">
        <input type="checkbox" id="sync-auto" ${syncConfig.autoSync ? 'checked' : ''} />
        <div>
          <div class="settings-toggle-label">Auto-sync on every change</div>
          <div class="settings-toggle-sub">Pushes to your Gist 2.5s after each edit.</div>
        </div>
      </label>

      <div class="settings-status-line" id="sync-last">Last synced: ${syncConfig.lastSyncedAt ? relativeTime(syncConfig.lastSyncedAt) : 'never'}</div>
    </div>`;
}

/* ────────────────────────────────────────────
   EVENT HANDLERS
   ──────────────────────────────────────────── */

function attachHomeHandlers() {
  $('.dash-cta')?.addEventListener('click', e => {
    const action = e.currentTarget.dataset.heroAction;
    if (action === 'resume') {
      setView('train');
    } else if (action === 'start-today') {
      const day = todaysSplitDay();
      if (day) startSession(day.id, todayISO());
      else setView('train');
    } else if (action === 'go-train') {
      setView('train');
    } else if (action === 'go-split') {
      setView('routine');
    }
  });

  attachCalendarHandlers();
  attachCalPanelHandlers();
}

function attachCalendarHandlers() {
  $$('[data-cal-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const dir = Number(el.dataset.calNav);
      const [y, m] = calendarMonth.split('-').map(Number);
      let ny = y, nm = m + dir;
      if (nm < 1) { nm = 12; ny--; }
      if (nm > 12) { nm = 1; ny++; }
      calendarMonth = `${ny}-${String(nm).padStart(2, '0')}`;
      const container = $('#calendar-container');
      if (container) {
        container.innerHTML = renderCalendar();
        attachCalendarHandlers(); // re-bind nav + day handlers on the fresh DOM
      }
    });
  });
  attachCalendarDayHandlers();
}

function attachBackupHandlers() {
  $('#export-btn')?.addEventListener('click', exportJSON);
  $('#import-btn')?.addEventListener('click', () => $('#import-file')?.click());
  $('#import-file')?.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (file) importJSON(file);
    e.target.value = ''; // allow re-importing the same file
  });
}

function attachCalendarDayHandlers() {
  $$('[data-cal-day]').forEach(el => {
    el.addEventListener('click', () => {
      const iso = el.dataset.calDay;
      selectedDate = iso;
      $$('.cal-day.selected').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      const panel = $('#cal-panel');
      if (panel) panel.innerHTML = renderCalPanel(iso);
      attachCalPanelHandlers();
    });
  });
}

function attachCalPanelHandlers() {
  $$('[data-cal-open-session]').forEach(el => {
    el.addEventListener('click', () => setActiveSession(el.dataset.calOpenSession));
  });
  $$('[data-cal-log-date]').forEach(el => {
    el.addEventListener('click', () => {
      const iso = el.dataset.calLogDate;
      const dow = parseISO(iso)?.getDay();
      const day = dow != null ? state.split.days.find(d => d.dayOfWeek === dow) : null;
      if (day) startSession(day.id, iso);
      else startEmptySession(iso);
    });
  });
}

function attachTrainHandlers() {
  // Day picker
  $('#picker-date')?.addEventListener('change', () => {});
  $$('[data-start-day]').forEach(el => {
    el.addEventListener('click', () => {
      const date = $('#picker-date')?.value || todayISO();
      startSession(el.dataset.startDay, date);
    });
  });
  $('#empty-session-btn')?.addEventListener('click', () => {
    const date = $('#picker-date')?.value || todayISO();
    startEmptySession(date);
  });
  $('#goto-routine')?.addEventListener('click', () => setView('routine'));

  // Whatever is being edited — draft if there is one, else active saved session.
  const session = state.draft || getSession(state.activeId);
  if (!session) return;
  const isDraft = isDraftId(session.id);

  // Header buttons (differ for draft vs saved)
  $('#session-back-btn')?.addEventListener('click', () => closeSession());
  $('#session-discard-btn')?.addEventListener('click', () => discardDraft());
  $('#delete-session-btn')?.addEventListener('click', () => deleteSession(session.id));

  // Save / discard at bottom of draft view
  $('#save-draft-btn')?.addEventListener('click', () => saveDraft());

  $('#session-date')?.addEventListener('change', e => setSessionDate(session.id, e.target.value));
  $('#session-name')?.addEventListener('input', e => setSessionDayName(session.id, e.target.value));

  $('#add-exercise-form')?.addEventListener('submit', e => {
    e.preventDefault();
    const input = $('#new-exercise-name');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    addSessionExercise(session.id, name);
  });

  $$('[data-edit-exercise]').forEach(el => {
    el.addEventListener('input', e => updateSessionExerciseName(session.id, el.dataset.editExercise, e.target.value));
  });

  $$('[data-delete-exercise]').forEach(el => {
    el.addEventListener('click', () => deleteSessionExercise(session.id, el.dataset.deleteExercise));
  });

  $$('[data-add-set]').forEach(el => {
    el.addEventListener('click', () => addSessionSet(session.id, el.dataset.addSet));
  });

  $$('[data-delete-set]').forEach(el => {
    el.addEventListener('click', () => deleteSessionSet(session.id, el.dataset.exerciseId, el.dataset.deleteSet));
  });

  $$('[data-toggle-set]').forEach(el => {
    el.addEventListener('click', () => toggleSessionSet(session.id, el.dataset.exerciseId, el.dataset.toggleSet));
  });

  $$('[data-set-field]').forEach(el => {
    el.addEventListener('input', e => {
      const value = e.target.value;
      updateSessionSet(session.id, el.dataset.exerciseId, el.dataset.setId, el.dataset.setField, value);

      // Update this row's volume + summary numbers without a full re-render.
      const setEl = el.closest('.set');
      if (setEl) {
        const repsEl    = $('[data-set-field="reps"]', setEl);
        const machineEl = $('[data-set-field="machineWeight"]', setEl);
        const plateEl   = $('[data-set-field="plateWeight"]', setEl);
        const reps    = parseFloat(repsEl?.value) || 0;
        const machine = parseFloat(machineEl?.value) || 0;
        const plate   = parseFloat(plateEl?.value) || 0;
        const total   = machine + plate;
        const volEl = $('[data-set-volume]', setEl);
        if (volEl) {
          // Preserve any trailing PB marker
          const pbMarker = $('.set-pb-marker', volEl);
          volEl.textContent = formatVolume(reps * total);
          if (pbMarker) volEl.appendChild(pbMarker);
        }
      }
      updateSummariesInPlace();
    });

    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const card = $(`.exercise[data-exercise-id="${el.dataset.exerciseId}"]`);
      if (!card) return;
      const all = $$('[data-set-field]', card);
      const idx = all.indexOf(el);
      if (idx >= 0 && idx + 1 < all.length) {
        all[idx + 1].focus();
        all[idx + 1].select?.();
      } else {
        addSessionSet(session.id, el.dataset.exerciseId);
      }
    });
  });
}

function updateSummariesInPlace() {
  const session = state.draft || getSession(state.activeId);
  if (!session) return;

  const totalSets = sessionTotalSets(session);
  const completedSets = sessionCompletedSets(session);
  const totalReps = sessionTotalReps(session);
  const volume = sessionVolume(session);
  const progressPct = totalSets > 0 ? (completedSets / totalSets) * 100 : 0;

  const sets = $('[data-summary="sets"]'); if (sets) sets.innerHTML = `${completedSets}<span class="unit">/${totalSets}</span>`;
  const reps = $('[data-summary="reps"]'); if (reps) reps.textContent = totalReps;
  const ex = $('[data-summary="exercises"]'); if (ex) ex.textContent = session.exercises.length;
  const vol = $('[data-summary="volume"]'); if (vol) vol.innerHTML = `${formatVolume(volume)}<span class="unit"> kg</span>`;
  const progress = $('[data-progress]'); if (progress) progress.style.width = `${progressPct}%`;

  session.exercises.forEach(e => {
    const v = exerciseVolume(e);
    const el = $(`[data-exercise-volume="${e.id}"]`);
    if (el) el.textContent = `${formatVolume(v)} kg`;
  });

  $('#stat-volume').textContent = formatVolume(recentVolume(7));
}

function attachSettingsHandlers() {
  // UI scale slider
  const scaleSlider = $('#ui-scale-slider');
  const scaleValue = $('#ui-scale-value');
  if (scaleSlider) {
    scaleSlider.addEventListener('input', e => {
      const v = Number(e.target.value) || 1;
      prefs.uiScale = v;
      applyUIScale();
      if (scaleValue) scaleValue.textContent = `${Math.round(v * 100)}%`;
    });
    scaleSlider.addEventListener('change', () => savePrefs());
  }
  $$('[data-ui-scale-set]').forEach(el => {
    el.addEventListener('click', () => {
      const v = Number(el.dataset.uiScaleSet) || 1;
      prefs.uiScale = v;
      applyUIScale();
      savePrefs();
      if (scaleSlider) scaleSlider.value = String(v);
      if (scaleValue) scaleValue.textContent = `${Math.round(v * 100)}%`;
    });
  });

  // Backup
  attachBackupHandlers();

  // Gist sync — token input
  const tokenInput = $('#sync-token');
  tokenInput?.addEventListener('input', e => {
    syncConfig.token = e.target.value.trim();
    saveSyncConfig();
    setSyncStatus(syncConfig.token ? 'Ready' : 'Not configured', syncConfig.token ? 'ok' : '');
  });

  // Show/hide token
  $('#sync-token-toggle')?.addEventListener('click', () => {
    if (!tokenInput) return;
    const showing = tokenInput.type === 'text';
    tokenInput.type = showing ? 'password' : 'text';
    const useEl = $('#sync-token-toggle svg use');
    if (useEl) useEl.setAttribute('href', showing ? '#icon-eye' : '#icon-eye-off');
  });

  // Gist ID input
  $('#sync-gist-id')?.addEventListener('input', e => {
    syncConfig.gistId = e.target.value.trim();
    saveSyncConfig();
  });

  // Push / Pull
  $('#sync-push')?.addEventListener('click', () => pushToGist());
  $('#sync-pull')?.addEventListener('click', () => pullFromGist());

  // Auto-sync toggle
  $('#sync-auto')?.addEventListener('change', e => {
    syncConfig.autoSync = e.target.checked;
    saveSyncConfig();
    if (syncConfig.autoSync && syncConfig.token) {
      // Push current state immediately so the gist matches what's on screen.
      pushToGist();
    }
  });
}

/* ────────────────────────────────────────────
   INIT
   ──────────────────────────────────────────── */

/* iOS PWA: 100vh / 100dvh under-report height by 30-80px in some iOS versions.
   Pin the body height to window.innerHeight via a CSS variable so the
   bottom nav always lands at the literal screen bottom. */
function setAppHeight() {
  const h = window.innerHeight || document.documentElement.clientHeight;
  document.documentElement.style.setProperty('--app-height', h + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 100));

// Block pinch-zoom on iOS Safari, which honours neither `user-scalable=no`
// nor `touch-action` consistently across versions. Belt & braces.
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => {
  document.addEventListener(ev, e => e.preventDefault(), { passive: false });
});

/* ────────────────────────────────────────────
   AUTO-UPDATE — fetches latest HTML, prompts to reload on new version.
   ──────────────────────────────────────────── */

async function checkForUpdate() {
  // Skip when running from a local file (no network update path).
  if (location.protocol === 'file:') return;
  try {
    const url = location.pathname.split('?')[0] + '?_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return;
    const html = await res.text();
    const m = html.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
    if (m && m[1] && m[1] !== APP_VERSION) {
      showUpdateBanner(m[1]);
    }
  } catch (e) {
    console.warn('Update check failed:', e.message);
  }
}

function showUpdateBanner(newVersion) {
  if (document.getElementById('update-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.className = 'update-banner';
  banner.innerHTML = `
    <span class="update-banner-text">
      Update available: <strong>v${newVersion}</strong>
    </span>
    <button class="update-banner-btn" type="button">Reload</button>
    <button class="update-banner-dismiss" type="button" aria-label="Dismiss">&times;</button>
  `;
  document.body.appendChild(banner);
  banner.querySelector('.update-banner-btn').addEventListener('click', forceReload);
  banner.querySelector('.update-banner-dismiss').addEventListener('click', () => banner.remove());
}

function forceReload() {
  // Cache-busting query string forces iOS to refetch the HTML.
  const url = location.pathname.split('?')[0] + '?v=' + Date.now();
  location.replace(url);
}

/* Service worker — when sw.js exists alongside this HTML, it forces
   network-first for the page, so a hard refresh / app open always pulls
   the freshest copy. Falls back silently if sw.js is missing. */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {/* no sw.js — ignore */});
  });
}

// Block double-tap zoom by suppressing the second tap if it's within 300ms.
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 320) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// Stop the iOS rubber-band when dragging past the top/bottom of .page —
// overscroll-behavior alone is unreliable on Safari. Touch only:
// at the scroll boundaries, drag-up-when-at-top or drag-down-when-at-bottom
// has its default cancelled, so the document doesn't slide.
let touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (e.touches.length === 1) touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (e.touches.length !== 1) return;
  const page = document.getElementById('page');
  if (!page) return;
  // Touch must originate inside .page (or its descendants) for scroll to apply.
  const inPage = page.contains(e.target);
  if (!inPage) { e.preventDefault(); return; }
  const dy = e.touches[0].clientY - touchStartY;
  const atTop = page.scrollTop <= 0;
  const atBottom = page.scrollHeight - page.scrollTop - page.clientHeight <= 0;
  if ((atTop && dy > 0) || (atBottom && dy < 0)) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('DOMContentLoaded', () => {
  loadState();
  loadSyncConfig();
  loadPrefs();
  applyUIScale();
  ensureValid();
  // Background-check for a newer build on load (and again every 5 min).
  setTimeout(checkForUpdate, 800);
  setInterval(checkForUpdate, 5 * 60 * 1000);

  $$('.tab, .bottom-nav-btn, .topbar-icon-btn').forEach(el => {
    el.addEventListener('click', () => setView(el.dataset.view));
  });

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === 'n') {
      e.preventDefault();
      if (state.view === 'train' && state.activeId) closeSession();
      else setView('train');
    }
  });

  render();
});
</script>
</body>
</html>
