<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>GymLog · Workout Tracker</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { color-scheme: dark; }

:root {
  --bg: #08080b;
  --surface: #131318;
  --surface-2: #1a1a20;
  --surface-3: #22222a;
  --border: #2a2a33;
  --border-strong: #3a3a45;
  --border-subtle: #1f1f26;
  --text: #f5f5f7;
  --text-2: #9a9aa5;
  --text-3: #6a6a74;
  --text-4: #45454d;
  --accent: #10b981;
  --accent-hover: #34d399;
  --accent-text: #03261c;
  --accent-dim: rgba(16, 185, 129, 0.12);
  --accent-glow: rgba(16, 185, 129, 0.3);
  --gold: #f59e0b;
  --gold-text: #2a1a00;
  --gold-dim: rgba(245, 158, 11, 0.12);
  --indigo: #6366f1;
  --indigo-dim: rgba(99, 102, 241, 0.12);
  --danger: #ef4444;
  --danger-dim: rgba(239, 68, 68, 0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
}

html, body {
  height: 100%;
  /* Vertical-only gestures, no pinch-zoom, no chained scroll, no rubber-band. */
  touch-action: pan-y;
  overscroll-behavior: none;
  overflow: hidden;
  margin: 0;
  padding: 0;
}

/* User-controlled UI scale. Applied to .app so the bottom nav (sibling of
   .app, see body markup) stays anchored to the actual viewport. */
.app { zoom: var(--ui-scale, 1); }

body {
  /* iOS Safari hands back unreliable values for 100vh / 100dvh in PWA mode.
     `--app-height` is written by JS from `window.innerHeight` and is the
     source of truth for layout. */
  width: 100vw;
  height: var(--app-height, 100dvh);
  min-height: var(--app-height, 100dvh);

  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% -10%, rgba(16, 185, 129, 0.08), transparent 45%),
    radial-gradient(circle at 90% 110%, rgba(99, 102, 241, 0.06), transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; cursor: pointer; }
input { font: inherit; }
input::placeholder { color: var(--text-4); }

/* ─── App shell ──────────────────────────── */

.app {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr;
}

.topbar {
  padding-top: env(safe-area-inset-top);
  padding-left: max(24px, env(safe-area-inset-left));
  padding-right: max(24px, env(safe-area-inset-right));
  min-height: calc(64px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(10, 10, 13, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: relative;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

.logo {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--accent), #059669);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-text);
  box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
}

.brand-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.1;
}

.brand-sub {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 2px;
}

.tabs { display: flex; gap: 2px; flex: 1; }

.tab {
  background: transparent;
  border: none;
  color: var(--text-2);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: -0.005em;
}

.tab svg { width: 14px; height: 14px; opacity: 0.7; }
.tab:hover { color: var(--text); background: var(--surface); }
.tab.active { color: var(--text); background: var(--surface-2); }
.tab.active svg { opacity: 1; color: var(--accent); }

.topbar-stats { display: flex; gap: 24px; flex-shrink: 0; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat-label {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
}
.stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin-top: 2px;
}

/* ─── Page ───────────────────────────────── */

.page {
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 32px 40px 80px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 28px;
  gap: 16px;
}

.page-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.page-subtitle {
  font-size: 14px;
  color: var(--text-3);
  margin-top: 6px;
}

/* ─── Train: day picker ──────────────────── */

.day-picker-wrap {
  max-width: 920px;
  margin: 0 auto;
}

.day-picker-hero {
  text-align: center;
  margin: 24px 0 36px;
}

.day-picker-hero-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.day-picker-hero-sub {
  font-size: 15px;
  color: var(--text-2);
}

.day-picker-date-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
  font-size: 13px;
  color: var(--text-2);
}

.day-picker {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.day-card {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 22px 20px;
  text-align: left;
  color: var(--text);
  transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.day-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--accent-dim), transparent 60%);
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

.day-card:hover {
  border-color: rgba(16, 185, 129, 0.4);
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

.day-card:hover::before { opacity: 1; }

.day-card-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
  position: relative;
}

.day-card-meta {
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  font-weight: 500;
}

.day-card-meta .dot { color: var(--text-4); }

.day-card-empty {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  padding: 22px 20px;
}

.day-card-empty svg { opacity: 0.5; transition: opacity 0.15s ease; }

.day-card-empty:hover {
  border-style: solid;
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
  transform: none;
  box-shadow: none;
}

.day-card-empty:hover svg { opacity: 1; }

.day-card-today { border-color: rgba(16, 185, 129, 0.4); }
.day-card-today-pill {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 9px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 999px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.day-picker-divider {
  text-align: center;
  margin: 20px 0;
  color: var(--text-3);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

.day-picker-routine-link {
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
  margin-top: 32px;
}

.day-picker-routine-link a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  cursor: pointer;
}

.day-picker-routine-link a:hover { text-decoration: underline; }

/* ─── Train: session view ────────────────── */

.session-wrap { max-width: 920px; margin: 0 auto; }

.session-header { margin-bottom: 28px; }

.session-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}

.session-header-top-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.session-back-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-2);
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s ease;
}

.session-back-btn:hover {
  background: var(--surface-2);
  color: var(--text);
}

.session-back-btn svg { width: 14px; height: 14px; }

.session-date-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
}

.session-date-input:focus { outline: none; border-color: var(--accent); }

.session-title-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}

.session-title-input {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.02em;
  flex: 1;
  padding: 4px 0;
  border-bottom: 2px solid transparent;
}

.session-title-input::placeholder { color: var(--text-3); font-weight: 600; }
.session-title-input:focus { outline: none; }

.session-day-pill {
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 4px 10px;
  border-radius: 999px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}

.draft-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--indigo-dim);
  border: 1px solid rgba(99, 102, 241, 0.25);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 12px;
  margin-bottom: 16px;
  line-height: 1.4;
}
.draft-banner svg { color: var(--indigo); flex-shrink: 0; }
.draft-banner strong { color: var(--indigo); font-weight: 700; }

.draft-save-bar {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.draft-save-bar .btn-xl {
  width: 100%;
  max-width: 360px;
  font-size: 15px;
  min-height: 52px;
  box-shadow: 0 6px 20px var(--accent-glow);
}

.btn-link-danger {
  background: transparent;
  border: none;
  color: var(--text-3);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: underline;
  text-underline-offset: 2px;
  text-decoration-color: var(--text-4);
}
.btn-link-danger:hover { color: var(--danger); text-decoration-color: var(--danger); }

.update-banner {
  position: fixed;
  bottom: calc(86px + env(safe-area-inset-bottom));
  left: 12px;
  right: 12px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--accent);
  color: var(--accent-text);
  padding: 10px 12px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 8px 24px var(--accent-glow), 0 2px 6px rgba(0,0,0,0.4);
  z-index: 200;
  animation: fadeIn 0.18s ease;
}

.update-banner-text { flex: 1; min-width: 0; line-height: 1.3; }
.update-banner-text strong { font-weight: 800; }

.update-banner-btn {
  background: var(--accent-text);
  color: var(--accent);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  min-height: 36px;
  letter-spacing: -0.01em;
}

.update-banner-dismiss {
  background: transparent;
  border: none;
  color: var(--accent-text);
  font-size: 22px;
  line-height: 1;
  padding: 4px 8px;
  opacity: 0.7;
}
.update-banner-dismiss:hover { opacity: 1; }

@media (min-width: 861px) {
  .update-banner { bottom: 24px; }
}

.session-summary {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.summary-item {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
}

.summary-item.highlight {
  background: linear-gradient(135deg, var(--accent-dim), rgba(16, 185, 129, 0.04));
  border-color: rgba(16, 185, 129, 0.3);
  box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.08);
}

.summary-label {
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  font-weight: 600;
}

.summary-item.highlight .summary-label { color: var(--accent); }

.summary-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.summary-value .unit {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  margin-left: 2px;
}

.summary-item.highlight .summary-value .unit { color: rgba(16, 185, 129, 0.7); }

.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #34d399);
  transition: width 0.3s ease;
  border-radius: 2px;
}

/* ─── Exercises ──────────────────────────── */

.exercises {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 16px;
}

.exercise {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: all 0.2s ease;
  animation: fadeIn 0.18s ease;
}

.exercise.all-done {
  border-color: rgba(16, 185, 129, 0.3);
  background: linear-gradient(180deg, rgba(16, 185, 129, 0.04) 0%, var(--surface) 100%);
}

.exercise.has-pb {
  border-color: rgba(245, 158, 11, 0.4);
  background: linear-gradient(180deg, rgba(245, 158, 11, 0.05) 0%, var(--surface) 100%);
  box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.12);
}

.exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 12px;
}

.exercise-name-input {
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  flex: 1;
  padding: 4px 0;
  border-bottom: 1.5px solid transparent;
  min-width: 0;
}

.exercise-name-input:focus { outline: none; border-bottom-color: var(--accent); }
.exercise-name-input::placeholder { color: var(--text-3); }

.exercise-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.exercise-volume {
  font-size: 12px;
  color: var(--text-2);
  font-weight: 600;
  background: var(--surface-2);
  padding: 5px 12px;
  border-radius: 999px;
  white-space: nowrap;
}

.exercise.all-done .exercise-volume {
  color: var(--accent);
  background: var(--accent-dim);
}

.exercise-pb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-3);
  margin-bottom: 14px;
  padding: 0 2px;
  font-weight: 500;
}

.exercise-pb.new-pb {
  color: var(--gold);
  font-weight: 700;
  letter-spacing: 0.02em;
}

.exercise-pb-icon { width: 12px; height: 12px; flex-shrink: 0; }

.pb-flame { color: var(--gold); }

/* ─── Sets ───────────────────────────────── */

.sets { margin-bottom: 12px; }

.sets-header {
  display: grid;
  grid-template-columns: 40px 1fr 1.7fr 70px 36px 32px;
  gap: 8px;
  padding: 0 12px 8px;
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
}

.sets-header > div:nth-child(2),
.sets-header > div:nth-child(4) { text-align: center; }

.weight-pair-headers {
  display: grid;
  grid-template-columns: 1fr 14px 1fr;
  gap: 4px;
}
.weight-pair-headers > div { text-align: center; }

.set {
  display: grid;
  grid-template-columns: 40px 1fr 1.7fr 70px 36px 32px;
  gap: 8px;
  align-items: center;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  transition: background 0.15s ease;
  margin-bottom: 2px;
}

.weight-pair {
  display: grid;
  grid-template-columns: 1fr 14px 1fr;
  gap: 4px;
  align-items: center;
}

.weight-pair-plus {
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
  font-weight: 700;
  line-height: 1;
}

.set:hover { background: var(--surface-2); }
.set.complete { background: rgba(16, 185, 129, 0.05); }
.set.is-pb {
  background: linear-gradient(90deg, rgba(245, 158, 11, 0.08), transparent);
  box-shadow: inset 2px 0 0 var(--gold);
}

.set-num {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  text-align: center;
}

.set.complete .set-num { color: var(--accent); }
.set.is-pb .set-num { color: var(--gold); }

.set-input {
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  padding: 9px 12px;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  width: 100%;
  text-align: center;
  -moz-appearance: textfield;
  transition: all 0.12s ease;
}

.set-input::-webkit-outer-spin-button,
.set-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.set-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.set.complete .set-input {
  background: rgba(16, 185, 129, 0.04);
  border-color: rgba(16, 185, 129, 0.18);
}

.set-volume {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 600;
  text-align: center;
  padding: 0 8px;
  position: relative;
}

.set.complete .set-volume { color: var(--accent); }

.set-pb-marker {
  display: inline-block;
  margin-left: 6px;
  color: var(--gold);
  font-size: 10px;
  vertical-align: middle;
}

.check-btn {
  width: 30px;
  height: 30px;
  border: 1.5px solid var(--border);
  background: transparent;
  border-radius: 50%;
  color: transparent;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin: 0 auto;
}

.check-btn svg { width: 14px; height: 14px; }

.check-btn:hover { border-color: var(--accent); color: var(--accent); }

.check-btn.checked {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  box-shadow: 0 0 0 4px var(--accent-dim);
}

.icon-btn {
  width: 30px;
  height: 30px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-xs);
  color: var(--text-3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  padding: 0;
}

.icon-btn svg { width: 14px; height: 14px; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover { background: var(--danger-dim); color: var(--danger); }
.icon-btn.lg { width: 34px; height: 34px; }
.icon-btn.lg svg { width: 16px; height: 16px; }

/* ─── Buttons ────────────────────────────── */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  transition: all 0.15s ease;
  white-space: nowrap;
}

.btn:hover { background: var(--surface-3); border-color: var(--text-3); }

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-text);
  box-shadow: 0 4px 14px var(--accent-glow);
}

.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.btn-ghost {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-2);
  width: 100%;
  padding: 10px;
}

.btn-ghost:hover {
  border-color: var(--accent);
  border-style: solid;
  color: var(--accent);
  background: var(--accent-dim);
}

.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 12px 22px; font-size: 14px; }

/* ─── Add exercise inline form ───────────── */

.add-exercise-form {
  display: flex;
  gap: 8px;
  padding: 14px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  transition: border-color 0.15s ease;
}

.add-exercise-form:focus-within { border-color: var(--accent); border-style: solid; }

.add-exercise-form input {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  padding: 10px 14px;
  color: var(--text);
  font-size: 14px;
}

.add-exercise-form input:focus { outline: none; border-color: var(--accent); }

/* ─── History ────────────────────────────── */

.history-wrap { max-width: 920px; margin: 0 auto; }

.history-group { margin-bottom: 28px; }

.history-group-header {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  margin-bottom: 10px;
  padding-left: 4px;
}

.history-row {
  display: grid;
  grid-template-columns: 64px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  transition: all 0.15s ease;
  text-align: left;
  width: 100%;
  color: var(--text);
  min-height: 64px;
}

.history-row:hover, .history-row:active {
  border-color: var(--border-strong);
  background: var(--surface-2);
}

.history-row.has-pb {
  border-left: 3px solid var(--gold);
  padding-left: 15px;
}

.history-date { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.history-date-dow { font-size: 11px; color: var(--text-2); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.history-date-num { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; letter-spacing: -0.02em; }

.history-main { min-width: 0; }
.history-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

.history-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-name.muted { color: var(--text-3); font-style: italic; font-weight: 500; }

.history-name-row { display: flex; align-items: center; gap: 8px; }

.history-stats { font-size: 12px; color: var(--text-3); font-weight: 500; margin-top: 3px; }

.history-volume { font-size: 14px; font-weight: 700; color: var(--text); text-align: right; letter-spacing: -0.01em; }
.history-volume .unit { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 2px; }

.history-progress {
  font-size: 11px;
  color: var(--text-2);
  font-weight: 600;
  text-align: right;
  background: var(--surface-2);
  padding: 4px 10px;
  border-radius: 999px;
}

.history-progress.complete {
  background: var(--accent-dim);
  color: var(--accent);
}

.history-pb-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--gold-dim);
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.history-pb-badge svg { width: 10px; height: 10px; }

/* ─── Records ────────────────────────────── */

.records-wrap { max-width: 920px; margin: 0 auto; }

.records-search {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: var(--text);
  font-size: 13px;
  margin-bottom: 16px;
  width: 100%;
  max-width: 320px;
}

.records-search:focus { outline: none; border-color: var(--accent); }

.records-grid {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.record-row {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 16px;
  align-items: center;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
}

.record-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.record-stat {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  min-width: 90px;
}

.record-stat-label {
  font-size: 9px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 2px;
}

.record-stat-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
}

.record-stat-value.gold { color: var(--gold); }

.record-stat-value .unit { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 1px; }

.record-stat-breakdown {
  font-size: 10px;
  color: var(--text-3);
  font-weight: 500;
  margin-top: 3px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  letter-spacing: -0.02em;
  text-align: right;
}

.record-plus {
  font-weight: 500;
  opacity: 0.6;
  margin: 0 1px;
}

.record-date { font-size: 11px; color: var(--text-3); font-weight: 500; }

/* ─── Routine ────────────────────────────── */

.routine-wrap { max-width: 920px; margin: 0 auto; }

.routine-day {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
  animation: fadeIn 0.18s ease;
}

.routine-day-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  gap: 12px;
}

.routine-day-name {
  font-size: 17px;
  font-weight: 700;
  background: transparent;
  border: none;
  color: var(--text);
  letter-spacing: -0.01em;
  flex: 1;
  padding: 4px 0;
  border-bottom: 1.5px solid transparent;
  min-width: 0;
}

.routine-day-name:focus { outline: none; border-bottom-color: var(--accent); }
.routine-day-name::placeholder { color: var(--text-3); }

.routine-day-meta {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  white-space: nowrap;
}

.routine-exercises { padding: 8px 12px 12px; }

.routine-ex-headers {
  display: grid;
  grid-template-columns: 1fr 56px 56px 70px 70px 32px;
  gap: 6px;
  padding: 6px 8px 4px;
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}

.routine-ex-headers > div:nth-child(2),
.routine-ex-headers > div:nth-child(3),
.routine-ex-headers > div:nth-child(4),
.routine-ex-headers > div:nth-child(5) { text-align: center; }

.routine-ex {
  display: grid;
  grid-template-columns: 1fr 56px 56px 70px 70px 32px;
  gap: 6px;
  align-items: center;
  padding: 5px 8px;
  border-radius: var(--radius-xs);
  transition: background 0.15s ease;
  margin-bottom: 2px;
}

.routine-ex:hover { background: var(--surface-2); }

.routine-ex-name {
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-xs);
  padding: 8px 10px;
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  width: 100%;
  min-width: 0;
}

.routine-ex-name:focus,
.routine-ex-name:hover {
  border-color: var(--border-subtle);
  background: var(--surface-2);
}

.routine-ex-name:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}

.routine-ex-name::placeholder { color: var(--text-3); font-weight: 500; }

.routine-ex-num {
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xs);
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  width: 100%;
  text-align: center;
  -moz-appearance: textfield;
}

.routine-ex-num::-webkit-outer-spin-button,
.routine-ex-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.routine-ex-num:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}

.routine-add-ex-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-2);
  padding: 10px;
  font-size: 13px;
  font-weight: 600;
  margin-top: 6px;
  transition: all 0.15s ease;
}

.routine-add-ex-btn:hover {
  border-color: var(--accent);
  border-style: solid;
  color: var(--accent);
  background: var(--accent-dim);
}

.routine-add-ex-btn svg { width: 12px; height: 12px; }

.add-day-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: transparent;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-2);
  padding: 18px;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.15s ease;
}

.add-day-btn:hover {
  border-color: var(--accent);
  border-style: solid;
  color: var(--accent);
  background: var(--accent-dim);
}

/* ─── Empty state ────────────────────────── */

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  text-align: center;
  color: var(--text-2);
  min-height: 50vh;
}

.empty-state-sm { padding: 36px 16px; min-height: auto; }

.empty-icon {
  width: 64px;
  height: 64px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  margin-bottom: 20px;
}

.empty-icon svg { width: 28px; height: 28px; }

.empty-text {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.empty-sub {
  font-size: 14px;
  color: var(--text-3);
  margin-bottom: 20px;
  max-width: 320px;
}

/* ─── Toast ──────────────────────────────── */

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

.toast .toast-action {
  background: transparent;
  border: none;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 4px;
}

.toast .toast-action:hover { background: var(--accent-dim); }

/* ─── Misc ───────────────────────────────── */

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.pb-pop { animation: pop 0.25s ease; }

/* ─── Bottom nav (mobile) ────────────────── */

.bottom-nav {
  display: none;
  /* Anchor the nav to the actual viewport bottom — independent of body's
     own height calculation. Solid background so any layout gap below would
     be unambiguous (instead of disappearing into the body backdrop). */
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-top: 6px;
  padding-bottom: max(6px, env(safe-area-inset-bottom));
  padding-left: max(4px, env(safe-area-inset-left));
  padding-right: max(4px, env(safe-area-inset-right));
  z-index: 50;
}

.bottom-nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: transparent;
  border: none;
  color: var(--text-3);
  padding: 8px 4px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.02em;
  min-height: 56px;
  transition: color 0.15s ease;
}

.bottom-nav-btn svg { width: 22px; height: 22px; }
.bottom-nav-btn.active { color: var(--accent); }
.bottom-nav-btn.active svg { filter: drop-shadow(0 0 8px var(--accent-glow)); }
.bottom-nav-btn:active { background: var(--surface); }

/* ─── Dashboard ──────────────────────────── */

.dashboard-wrap { max-width: 720px; margin: 0 auto; }

.dash-hero {
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.10), rgba(99, 102, 241, 0.05));
  border: 1px solid rgba(16, 185, 129, 0.2);
  border-radius: 18px;
  padding: 26px 22px;
  margin-bottom: 14px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.dash-hero::before {
  content: '';
  position: absolute;
  top: -60%;
  right: -20%;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, var(--accent-glow), transparent 65%);
  pointer-events: none;
  opacity: 0.5;
}

.dash-greeting {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
  margin-bottom: 4px;
  position: relative;
}

.dash-date {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 18px;
  position: relative;
  line-height: 1.2;
}

.dash-cta {
  width: 100%;
  max-width: 340px;
  padding: 14px 22px;
  font-size: 15px;
  border-radius: 12px;
  position: relative;
  min-height: 50px;
  gap: 8px;
}

.dash-hero-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 12px;
  position: relative;
}

.dash-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.dash-stat {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 14px 10px;
  text-align: center;
}

.dash-stat-value {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1.1;
  margin-bottom: 4px;
}

.dash-stat-value.gold { color: var(--gold); }
.dash-stat-value.accent { color: var(--accent); }
.dash-stat-value.muted { color: var(--text-3); }
.dash-stat-value .unit { font-size: 11px; font-weight: 500; color: var(--text-3); }

.dash-stat-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  line-height: 1.2;
}

/* ─── Calendar ───────────────────────────── */

.calendar {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.cal-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.cal-nav {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 8px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: all 0.15s ease;
}

.cal-nav svg { width: 14px; height: 14px; }
.cal-nav:hover, .cal-nav:active { background: var(--surface-3); color: var(--text); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
  margin-bottom: 4px;
}

.cal-weekdays > div {
  text-align: center;
  font-size: 10px;
  color: var(--text-3);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 0;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  aspect-ratio: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  padding: 0;
  min-height: 38px;
  transition: all 0.12s ease;
}

.cal-day-num { line-height: 1; }
.cal-day:hover { background: var(--surface-2); }
.cal-day.muted { color: var(--text-4); pointer-events: none; opacity: 0.45; }

.cal-day.has-workout { background: var(--accent-dim); }
.cal-day.has-workout .cal-day-num { color: var(--accent); font-weight: 700; }
.cal-day.has-workout .cal-day-dot {
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.cal-day.today { border-color: var(--accent); }

.cal-day.selected {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
.cal-day.selected .cal-day-num { color: var(--accent-text); font-weight: 700; }
.cal-day.selected .cal-day-dot { background: var(--accent-text); }

/* selected-date panel */

.cal-selected-panel {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
  animation: fadeIn 0.18s ease;
}

.cal-panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.cal-panel-date { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.cal-panel-name { font-size: 17px; font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; }
.cal-panel-stats { font-size: 13px; color: var(--text-2); margin-bottom: 14px; font-weight: 500; }
.cal-panel-empty { font-size: 14px; color: var(--text-3); margin-bottom: 14px; }
.cal-panel-btn { width: 100%; min-height: 44px; }

.cal-panel-hint {
  font-size: 13px;
  color: var(--text-3);
  text-align: center;
  padding: 14px 0;
}

/* ─── Topbar settings button ─────────────── */

.topbar-icon-btn {
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 10px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
  margin-left: auto; /* push to right when other topbar items are hidden */
  transition: all 0.15s ease;
}

.topbar-icon-btn svg { width: 18px; height: 18px; }
.topbar-icon-btn:hover { background: var(--surface-2); color: var(--text); }
.topbar-icon-btn.active {
  background: var(--accent-dim);
  border-color: rgba(16, 185, 129, 0.4);
  color: var(--accent);
}

/* ─── Settings page ──────────────────────── */

.settings-wrap { max-width: 720px; margin: 0 auto; }

.settings-section {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}

.settings-section-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 14px;
}

.settings-section-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.005em;
}

.settings-section-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}

.settings-section-status {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-3);
  white-space: nowrap;
  flex-shrink: 0;
}

.settings-section-status.ok { background: var(--accent-dim); color: var(--accent); }
.settings-section-status.err { background: var(--danger-dim); color: var(--danger); }
.settings-section-status.busy { background: var(--indigo-dim); color: var(--indigo); }

.settings-help {
  font-size: 12px;
  color: var(--text-3);
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 14px;
  line-height: 1.55;
}

.settings-help summary {
  cursor: pointer;
  font-weight: 600;
  color: var(--text-2);
  padding: 2px 0;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}

.settings-help summary::before {
  content: '›';
  display: inline-block;
  transition: transform 0.15s ease;
  font-size: 14px;
  color: var(--text-3);
}

.settings-help[open] summary::before { transform: rotate(90deg); }

.settings-help ol { padding-left: 18px; margin-top: 8px; }
.settings-help li { margin-bottom: 4px; }
.settings-help a { color: var(--accent); text-decoration: none; }
.settings-help a:hover { text-decoration: underline; }
.settings-help code {
  background: var(--bg);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  color: var(--text-2);
}

.settings-field { margin-bottom: 12px; }

.settings-field label {
  display: block;
  font-size: 11px;
  color: var(--text-2);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.settings-field-hint {
  text-transform: none;
  letter-spacing: 0;
  color: var(--text-3);
  font-weight: 500;
  font-size: 11px;
}

.settings-input-row { display: flex; gap: 6px; }
.settings-input-row .icon-btn { flex-shrink: 0; }

.settings-input,
.settings-field input[type="text"],
.settings-field input[type="password"] {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 14px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  min-height: 44px;
}

.settings-input:focus,
.settings-field input:focus { outline: none; border-color: var(--accent); }

.settings-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.settings-actions .btn { flex: 1; min-width: 140px; min-height: 44px; }

.settings-toggle {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  cursor: pointer;
  margin-bottom: 10px;
  user-select: none;
  min-height: 44px;
}

.settings-toggle:hover { background: var(--surface-3); }

.settings-toggle input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 38px;
  height: 22px;
  background: var(--surface-3);
  border-radius: 999px;
  position: relative;
  cursor: pointer;
  transition: background 0.18s ease;
  flex-shrink: 0;
}

.settings-toggle input[type="checkbox"]::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text-2);
  transition: all 0.18s ease;
}

.settings-toggle input[type="checkbox"]:checked { background: var(--accent); }
.settings-toggle input[type="checkbox"]:checked::after {
  left: 18px;
  background: var(--accent-text);
}

.settings-toggle-label { font-size: 13px; font-weight: 600; flex: 1; }
.settings-toggle-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; font-weight: 400; }

.settings-status-line {
  font-size: 12px;
  color: var(--text-3);
  padding: 6px 4px 0;
}

.settings-version { text-align: right; flex-shrink: 0; }

.settings-version-tag {
  display: inline-block;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 4px 10px;
  border-radius: 999px;
  letter-spacing: -0.01em;
}

.settings-version-date {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 4px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
}

.ui-scale-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.ui-scale-row input[type="range"] {
  flex: 1;
  height: 32px;
  background: transparent;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}

.ui-scale-row input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  background: var(--surface-3);
  border-radius: 999px;
}

.ui-scale-row input[type="range"]::-moz-range-track {
  height: 6px;
  background: var(--surface-3);
  border-radius: 999px;
}

.ui-scale-row input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
  box-shadow: 0 2px 8px var(--accent-glow);
  margin-top: -8px;
  cursor: grab;
}

.ui-scale-row input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg);
  box-shadow: 0 2px 8px var(--accent-glow);
  cursor: grab;
}

.ui-scale-marks {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-3);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  padding: 6px 4px 0;
  letter-spacing: -0.02em;
}

#ui-scale-value {
  color: var(--accent);
  font-weight: 700;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
}

/* ─── Backup section (within settings) ───── */

.backup-section {
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.backup-section-header {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 12px;
}

.backup-buttons { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.backup-buttons .btn { flex: 1; min-width: 140px; min-height: 44px; }

.backup-hint {
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
}

/* ─── Sub-tabs (history) ─────────────────── */

.sub-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface);
  padding: 4px;
  border-radius: 10px;
  margin-bottom: 16px;
  border: 1px solid var(--border-subtle);
}

.sub-tab {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-2);
  padding: 9px 12px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.15s ease;
  min-height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.sub-tab:hover { color: var(--text); }
.sub-tab.active {
  background: var(--surface-3);
  color: var(--text);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

/* ─── Day-of-week pills (routine) ────────── */

.routine-day-dow {
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 6px 28px 6px 10px;
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%239a9aa5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 8px center;
  min-height: 36px;
}

.routine-day-dow:focus { outline: none; border-color: var(--accent); }
.routine-day-dow.assigned { color: var(--accent); border-color: rgba(16, 185, 129, 0.3); background-color: var(--accent-dim); }

/* ─── XL button ──────────────────────────── */

.btn-xl {
  padding: 14px 24px;
  font-size: 15px;
  min-height: 50px;
  border-radius: 12px;
}

/* ─── Mobile (≤860px) ────────────────────── */

@media (max-width: 860px) {
  .app { grid-template-rows: auto 1fr; }

    min-height: calc(52px + env(safe-area-inset-top));
    height: auto;
    gap: 12px;
  }
  .brand-sub { display: none; }
  .brand-name { font-size: 15px; }
  .logo { width: 32px; height: 32px; border-radius: 8px; }
  .tabs-top { display: none; }
  .topbar-stats { display: none; }
  .bottom-nav { display: flex; }
  .page {
    padding: 16px max(14px, env(safe-area-inset-left)) calc(80px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right));
  }
  .page-title { font-size: 22px; }
  .page-subtitle { font-size: 13px; }
  .page-header { margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }

  /* All buttons: 44px min tap target */
  .btn { min-height: 44px; padding: 11px 16px; font-size: 14px; }
  .btn-sm { min-height: 38px; padding: 8px 12px; font-size: 12px; }
  .icon-btn { width: 40px; height: 40px; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.lg { width: 44px; height: 44px; }

  /* Dashboard */
  .dash-hero { padding: 22px 18px; }

  .calendar { padding: 12px 10px; }
  .cal-day { min-height: 40px; font-size: 13px; }

  .day-picker-hero { margin: 8px 0 24px; }

  /* Train: session view */
  .session-summary { grid-template-columns: repeat(2, 1fr); gap: 8px; }

  .summary-value { font-size: 20px; }
  .session-title-input { font-size: 24px; }
  .session-header-top { flex-wrap: wrap; }
  .session-back-btn { min-height: 40px; }
  .session-date-input { min-height: 40px; }

  /* Sets: keep horizontal but bigger touch targets */
  .sets-header,
  .set { grid-template-columns: 26px 1fr 1.8fr 44px 40px 32px; gap: 4px; padding: 6px 6px; }
  .set-input { padding: 11px 2px; font-size: 14px; min-height: 44px; }
  .weight-pair { gap: 2px; grid-template-columns: 1fr 10px 1fr; }
  .weight-pair-headers { gap: 2px; grid-template-columns: 1fr 10px 1fr; }
  .weight-pair-plus { font-size: 11px; }
  .set-volume { font-size: 11px; padding: 0; }
  .check-btn { width: 40px; height: 40px; }
  .check-btn svg { width: 16px; height: 16px; }
  .set .icon-btn { width: 32px; height: 32px; }
  .set .icon-btn svg { width: 14px; height: 14px; }

  .exercise { padding: 16px 14px; }
  .exercise-name-input { font-size: 16px; }

  /* Add-exercise form */
  .add-exercise-form { flex-direction: column; padding: 12px; }
  .add-exercise-form input { min-height: 44px; }
  .add-exercise-form .btn { width: 100%; }

  /* History */
  .history-row { padding: 12px 14px; gap: 10px; }
  .history-name { font-size: 14px; }

    grid-template-rows: auto;

    margin-bottom: 2px;
    align-items: center;

  .routine-ex .routine-ex-name {
    font-size: 13px; padding: 8px 8px; min-height: 40px;
    grid-column: auto; grid-row: auto;
  }
  .routine-ex > .icon-btn {
    width: 28px; height: 32px;
    grid-column: auto; grid-row: auto; align-self: center;
  }
  .routine-ex .routine-ex-num {
    grid-row: auto; grid-column: auto;
    min-height: 40px; padding: 8px 2px; font-size: 13px; text-align: center;
  }
  .routine-add-ex-btn { min-height: 44px; margin-top: 6px; }

  /* Empty state */
  .empty-state { padding: 48px 16px; min-height: 40vh; }
  .empty-icon { width: 56px; height: 56px; }
  .empty-text { font-size: 16px; }
  .empty-sub { font-size: 13px; }

  /* Settings on mobile */
  .settings-section { padding: 14px; }
  .settings-actions { gap: 6px; }
  .settings-actions .btn { min-width: 0; }

  /* Toast: mobile uses safe area + above bottom nav */
  .toast { bottom: calc(88px + env(safe-area-inset-bottom)); padding: 11px 16px; font-size: 13px; max-width: calc(100% - 32px); }

  /* iOS Safari auto-zooms when focusing any form field with font-size < 16px,

     below. */
  input, select, textarea { font-size: 16px !important; }
  .session-title-input { font-size: 24px !important; }
}

@media (max-width: 400px) {
  .sets-header,
  .set { grid-template-columns: 22px 1fr 1.8fr 38px 36px 30px; gap: 3px; padding: 6px 4px; }
  .set-input { padding: 10px 1px; font-size: 16px !important; }
  .weight-pair { gap: 1px; grid-template-columns: 1fr 8px 1fr; }
  .weight-pair-headers { gap: 1px; grid-template-columns: 1fr 8px 1fr; font-size: 9px; }
  .day-picker-hero-title { font-size: 20px; }
  .dash-stat-value { font-size: 19px; }
  .dash-stat-label { font-size: 8px; }
}

@media (min-width: 861px) {
  .bottom-nav { display: none !important; }
}

<script>
'use strict';

/* ────────────────────────────────────────────
   VERSION
   ──────────────────────────────────────────── */

const APP_VERSION = '1.3.5';
const APP_BUILD_DATE = '2026-05-05';

/* ────────────────────────────────────────────
   STATE + PERSISTENCE
   ──────────────────────────────────────────── */

const STORAGE_KEY = 'gymlog.v2';

const state = {
  split: { days: [] },
  sessions: [],
  activeId: null,
  draft: null,         // unsaved in-progress session (not on calendar / in history)
  view: 'home',
  historySub: 'sessions',
};

let pendingFocus = null;
let undoTimer = null;
let calendarMonth = null;     // 'YYYY-MM' (initialised on first render)
let selectedDate = null;      // 'YYYY-MM-DD' or null
let pickerDate = null;        // pre-fill for the day picker (transient)

function defaultSplit() {
  return {
    days: [
      {
        id: uid(), name: 'Push Day', dayOfWeek: 1, exercises: [
          { id: uid(), name: 'Bench Press',     defaultSets: 4, defaultReps: 8,  defaultMachineWeight: 60, defaultPlateWeight: 0 },
          { id: uid(), name: 'Overhead Press',  defaultSets: 3, defaultReps: 8,  defaultMachineWeight: 40, defaultPlateWeight: 0 },
          { id: uid(), name: 'Tricep Pushdown', defaultSets: 3, defaultReps: 12, defaultMachineWeight: 25, defaultPlateWeight: 0 },
        ],
      },
      {
        id: uid(), name: 'Pull Day', dayOfWeek: 3, exercises: [
          { id: uid(), name: 'Deadlift',     defaultSets: 3, defaultReps: 5,  defaultMachineWeight: 100, defaultPlateWeight: 0 },
          { id: uid(), name: 'Pull-Ups',     defaultSets: 3, defaultReps: 8,  defaultMachineWeight: 0,   defaultPlateWeight: 0 },
          { id: uid(), name: 'Barbell Row',  defaultSets: 3, defaultReps: 10, defaultMachineWeight: 50,  defaultPlateWeight: 0 },
          { id: uid(), name: 'Bicep Curl',   defaultSets: 3, defaultReps: 12, defaultMachineWeight: 12,  defaultPlateWeight: 0 },
        ],
      },
      {
        id: uid(), name: 'Leg Day', dayOfWeek: 5, exercises: [
          { id: uid(), name: 'Squat',             defaultSets: 4, defaultReps: 8,  defaultMachineWeight: 80,  defaultPlateWeight: 0 },
          { id: uid(), name: 'Romanian Deadlift', defaultSets: 3, defaultReps: 10, defaultMachineWeight: 60,  defaultPlateWeight: 0 },
          { id: uid(), name: 'Leg Press',         defaultSets: 3, defaultReps: 12, defaultMachineWeight: 100, defaultPlateWeight: 0 },
          { id: uid(), name: 'Calf Raise',        defaultSets: 4, defaultReps: 15, defaultMachineWeight: 40,  defaultPlateWeight: 0 },
        ],
      },
    ],
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data?.split?.days && Array.isArray(data.split.days)) state.split = data.split;
    if (Array.isArray(data?.sessions)) state.sessions = data.sessions;
    if (data?.activeId) state.activeId = data.activeId;
    if (data?.draft && data.draft.id) state.draft = data.draft;
    if (data?.view) state.view = data.view;
    if (data?.historySub) state.historySub = data.historySub;
  } catch (e) {
    console.warn('Failed to load state:', e);
  }
}

function saveState(opts = {}) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      split: state.split,
      sessions: state.sessions,
      activeId: state.activeId,
      draft: state.draft,
      view: state.view,
      historySub: state.historySub,
    }));
    if (!opts.skipAutoSync) scheduleAutoSync();
  } catch (e) {
    console.warn('Failed to save state:', e);
  }
}

function ensureValid() {
  if (!state.split.days?.length) state.split = defaultSplit();
  for (const d of state.split.days) {
    if (d.dayOfWeek == null) d.dayOfWeek = null;
  }
  if (state.activeId && !getSession(state.activeId)) state.activeId = null;
  if (state.view === 'records') { state.view = 'history'; state.historySub = 'records'; }
  if (!['home', 'train', 'history', 'routine', 'settings'].includes(state.view)) state.view = 'home';
  if (!['sessions', 'records'].includes(state.historySub)) state.historySub = 'sessions';

  // Migrate set.weight → set.machineWeight + set.plateWeight
  const migrateSets = (sess) => {
    for (const ex of sess.exercises || []) {
      for (const set of ex.sets || []) {
        if (set.machineWeight == null && set.plateWeight == null && 'weight' in set) {
          set.machineWeight = set.weight;
          set.plateWeight = '';
          delete set.weight;
        }
      }
    }
  };
  state.sessions.forEach(migrateSets);
  if (state.draft) migrateSets(state.draft);

  // Migrate split exercise defaultWeight → defaultMachineWeight + defaultPlateWeight
  for (const day of state.split.days) {
    for (const ex of day.exercises) {
      if (ex.defaultMachineWeight == null) {
        ex.defaultMachineWeight = 'defaultWeight' in ex ? ex.defaultWeight : '';
        ex.defaultPlateWeight = 0;
        delete ex.defaultWeight;
      }
    }
  }
}

/* ────────────────────────────────────────────
   HELPERS
   ──────────────────────────────────────────── */

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseISO(iso) {
  if (!iso) return null;
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatDateLong(iso) {
  const d = parseISO(iso);
  if (!d) return '';
  const t = todayISO();
  if (iso === t) return 'Today, ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  const yISO = yest.toISOString().slice(0, 10);
  if (iso === yISO) return 'Yesterday, ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateShort(iso) {
  const d = parseISO(iso);
  if (!d) return '';
  if (iso === todayISO()) return 'Today';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function daysAgoText(iso) {
  if (!iso) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const date = parseISO(iso); if (!date) return null;
  date.setHours(0, 0, 0, 0);
  const diff = Math.floor((today - date) / 86400000);
  if (diff < 0) return null;
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7)   return `${diff} days ago`;
  if (diff < 30)  return `${Math.floor(diff / 7)} wk ago`;
  if (diff < 365) return `${Math.floor(diff / 30)} mo ago`;
  return `${Math.floor(diff / 365)} yr ago`;
}

function formatVolume(v) {
  if (!v) return '0';
  if (v >= 100000) return (v / 1000).toFixed(0) + 'k';
  if (v >= 10000)  return (v / 1000).toFixed(1) + 'k';
  return Math.round(v).toLocaleString();
}

function formatWeight(w) {
  if (w == null || w === '') return '0';
  const n = Number(w);
  if (!Number.isFinite(n)) return '0';
  return n % 1 === 0 ? String(n) : n.toFixed(1);
}

function setWeight(set) {
  return (Number(set.machineWeight) || 0) + (Number(set.plateWeight) || 0);
}

function exerciseVolume(ex) {
  return ex.sets.reduce((s, set) => s + (Number(set.reps) || 0) * setWeight(set), 0);
}

function sessionVolume(sess) {
  return sess.exercises.reduce((s, ex) => s + exerciseVolume(ex), 0);
}

function sessionTotalSets(sess) {
  return sess.exercises.reduce((s, ex) => s + ex.sets.length, 0);
}

function sessionCompletedSets(sess) {
  return sess.exercises.reduce((s, ex) => s + ex.sets.filter(set => set.complete).length, 0);
}

function sessionTotalReps(sess) {
  return sess.exercises.reduce((s, ex) =>
    s + ex.sets.reduce((acc, set) => acc + (Number(set.reps) || 0), 0), 0);
}

function recentVolume(days = 7) {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days); cutoff.setHours(0, 0, 0, 0);
  const cutoffISO = cutoff.toISOString().slice(0, 10);
  return state.sessions.filter(s => s.date >= cutoffISO).reduce((sum, s) => sum + sessionVolume(s), 0);
}

function sortSessions() {
  state.sessions.sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return (b.createdAt || 0) - (a.createdAt || 0);
  });
}

function getSession(id) { return state.sessions.find(s => s.id === id); }
function getDay(id) { return state.split.days.find(d => d.id === id); }

// Returns the session being edited in the Train tab — either the unsaved
// draft (if its id matches) or a saved session.
function getEditingSession(id) {
  if (state.draft && state.draft.id === id) return state.draft;
  return state.sessions.find(s => s.id === id);
}

function isDraftId(id) {
  return !!(state.draft && state.draft.id === id);
}

function normalizeName(name) { return String(name || '').trim().toLowerCase(); }

function lastDoneForDay(dayId) {
  return state.sessions.filter(s => s.dayId === dayId)[0] || null;
}

function todaysSplitDay() {
  const dow = new Date().getDay(); // 0=Sun..6=Sat
  return state.split.days.find(d => d.dayOfWeek === dow) || null;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 5)  return 'Late night';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 22) return 'Good evening';
  return 'Late night';
}

// Monday-based ISO week start.
function getWeekStart(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay();
  const shift = (dow + 6) % 7;
  d.setDate(d.getDate() - shift);
  return d;
}

function weekKey(date) {
  const start = getWeekStart(date);
  const y = start.getFullYear();
  const m = String(start.getMonth() + 1).padStart(2, '0');
  const d = String(start.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function currentStreak() {
  if (!state.sessions.length) return 0;
  const weeks = new Set();
  for (const s of state.sessions) {
    const d = parseISO(s.date);
    if (d) weeks.add(weekKey(d));
  }
  if (!weeks.size) return 0;

  // Start from this week's Monday. If empty, fall back to last week.
  let cursor = getWeekStart(new Date());
  if (!weeks.has(weekKey(cursor))) {
    cursor.setDate(cursor.getDate() - 7);
    if (!weeks.has(weekKey(cursor))) return 0;
  }
  let streak = 0;
  while (weeks.has(weekKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 7);
  }
  return streak;
}

function thisMonthCount() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  return state.sessions.filter(s => s.date.startsWith(ym)).length;
}

function lastWorkoutDate() {
  return state.sessions.length ? state.sessions[0].date : null;
}

const DOW_LABELS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LABELS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

/* ────────────────────────────────────────────
   PERSONAL BESTS

   Two notions:
   • All-time best (Records page): best set ever, across all sessions.
   • PB-at-the-time (Train view + History): best set in this session that beats
     everything from sessions strictly before it. This means a PB stays a PB
     historically even after it gets surpassed in a later session.
   ──────────────────────────────────────────── */

function isSessionBefore(a, b) {
  if (a.date !== b.date) return a.date < b.date;
  return (a.createdAt || 0) < (b.createdAt || 0);
}

// All-time best single set (max weight; ties broken by reps).
function bestSetForExercise(name) {
  const norm = normalizeName(name);
  if (!norm) return null;
  let best = null;
  for (const session of state.sessions) {
    for (const ex of session.exercises) {
      if (normalizeName(ex.name) !== norm) continue;
      for (const set of ex.sets) {
        if (!set.complete) continue;
        const w = setWeight(set);
        const r = Number(set.reps) || 0;
        if (!w || !r) continue;
        if (!best || w > best.weight || (w === best.weight && r > best.reps)) {
          best = {
            weight: w,
            reps: r,
            date: session.date,
            sessionId: session.id,
            machineWeight: Number(set.machineWeight) || 0,
            plateWeight: Number(set.plateWeight) || 0,
          };
        }
      }
    }
  }
  return best;
}

// All-time best estimated 1RM (Epley: w * (1 + r/30)).
function bestE1RMForExercise(name) {
  const norm = normalizeName(name);
  if (!norm) return null;
  let best = null;
  for (const session of state.sessions) {
    for (const ex of session.exercises) {
      if (normalizeName(ex.name) !== norm) continue;
      for (const set of ex.sets) {
        if (!set.complete) continue;
        const w = setWeight(set);
        const r = Number(set.reps) || 0;
        if (!w || !r) continue;
        const e = w * (1 + r / 30);
        if (!best || e > best.e1rm) {
          best = {
            e1rm: e,
            weight: w,
            reps: r,
            date: session.date,
            sessionId: session.id,
            machineWeight: Number(set.machineWeight) || 0,
            plateWeight: Number(set.plateWeight) || 0,
          };
        }
      }
    }
  }
  return best;
}

// Best set across all sessions strictly BEFORE the given session.
function priorBestSet(session, exerciseName) {
  const norm = normalizeName(exerciseName);
  if (!norm) return null;
  let best = null;
  for (const s of state.sessions) {
    if (s.id === session.id) continue;
    if (!isSessionBefore(s, session)) continue;
    for (const ex of s.exercises) {
      if (normalizeName(ex.name) !== norm) continue;
      for (const set of ex.sets) {
        if (!set.complete) continue;
        const w = setWeight(set);
        const r = Number(set.reps) || 0;
        if (!w || !r) continue;
        if (!best || w > best.weight || (w === best.weight && r > best.reps)) {
          best = { weight: w, reps: r, date: s.date };
        }
      }
    }
  }
  return best;
}

// The best completed set in this session for a given exercise.
function sessionBestSetForEx(ex) {
  let best = null;
  for (const set of ex.sets) {
    if (!set.complete) continue;
    const w = setWeight(set);
    const r = Number(set.reps) || 0;
    if (!w || !r) continue;
    if (!best || w > best.weight || (w === best.weight && r > best.reps)) {
      best = { weight: w, reps: r, setId: set.id };
    }
  }
  return best;
}

function isPBSet(session, ex, set) {
  if (!set.complete) return false;
  const sessionBest = sessionBestSetForEx(ex);
  if (!sessionBest || sessionBest.setId !== set.id) return false;
  const prev = priorBestSet(session, ex.name);
  if (!prev) return true;
  if (sessionBest.weight > prev.weight) return true;
  if (sessionBest.weight === prev.weight && sessionBest.reps > prev.reps) return true;
  return false;
}

function exerciseHasPBInSession(session, ex) {
  const sessionBest = sessionBestSetForEx(ex);
  if (!sessionBest) return false;
  const prev = priorBestSet(session, ex.name);
  if (!prev) return true;
  if (sessionBest.weight > prev.weight) return true;
  if (sessionBest.weight === prev.weight && sessionBest.reps > prev.reps) return true;
  return false;
}

function sessionHitPBCount(session) {
  let count = 0;
  for (const ex of session.exercises) if (exerciseHasPBInSession(session, ex)) count++;
  return count;
}

/* ────────────────────────────────────────────
   MUTATIONS — SPLIT
   ──────────────────────────────────────────── */

function addSplitDay(name) {
  const newDay = {
    id: uid(),
    name: name || 'New Day',
    exercises: [],
  };
  state.split.days.push(newDay);
  saveState();
  pendingFocus = `[data-routine-day-name][data-day-id="${newDay.id}"]`;
  render();
}

function renameSplitDay(id, name) {
  const day = getDay(id);
  if (!day) return;
  day.name = name;
  saveState();
}

function setSplitDayOfWeek(id, dow) {
  const day = getDay(id);
  if (!day) return;
  const value = dow === '' || dow == null ? null : Number(dow);
  // Only one split day per day-of-week — clear conflicts.
  if (value != null) {
    for (const d of state.split.days) {
      if (d.id !== id && d.dayOfWeek === value) d.dayOfWeek = null;
    }
  }
  day.dayOfWeek = value;
  saveState();
  render();
}

function deleteSplitDay(id) {
  const idx = state.split.days.findIndex(d => d.id === id);
  if (idx < 0) return;
  const removed = state.split.days[idx];
  state.split.days.splice(idx, 1);
  saveState();
  render();
  showUndoToast(`Removed "${removed.name}"`, () => {
    state.split.days.splice(idx, 0, removed);
    saveState();
    render();
  });
}

function addSplitExercise(dayId) {
  const day = getDay(dayId);
  if (!day) return;
  const last = day.exercises[day.exercises.length - 1];
  const newEx = {
    id: uid(),
    name: '',
    defaultSets: last?.defaultSets || 3,
    defaultReps: last?.defaultReps || 10,
    defaultMachineWeight: last?.defaultMachineWeight || 0,
    defaultPlateWeight: last?.defaultPlateWeight || 0,
  };
  day.exercises.push(newEx);
  saveState();
  pendingFocus = `[data-routine-ex-name][data-ex-id="${newEx.id}"]`;
  render();
}

function updateSplitExercise(dayId, exId, field, value) {
  const day = getDay(dayId);
  const ex = day?.exercises.find(e => e.id === exId);
  if (!ex) return;
  if (field === 'name') ex.name = value;
  else ex[field] = value === '' ? '' : Number(value);
  saveState();
}

function deleteSplitExercise(dayId, exId) {
  const day = getDay(dayId);
  if (!day) return;
  day.exercises = day.exercises.filter(e => e.id !== exId);
  saveState();
  render();
}

/* ────────────────────────────────────────────
   MUTATIONS — SESSIONS
   ──────────────────────────────────────────── */

// Pre-fill the Train tab with the day's exercises as a DRAFT.
// Nothing is written to history or the calendar until saveDraft() is called.
function startSession(dayId, date) {
  // (drafts are discarded silently when starting a new session — undo via toast if needed)
  const day = getDay(dayId);
  if (!day) return;
  state.draft = {
    id: uid(),
    date: date || todayISO(),
    dayId: day.id,
    dayName: day.name,
    createdAt: Date.now(),
    exercises: day.exercises.map(ex => ({
      id: uid(),
      name: ex.name,
      sets: createDefaultSets(ex.defaultSets, ex.defaultReps, ex.defaultMachineWeight, ex.defaultPlateWeight),
    })),
  };
  state.activeId = null;
  state.view = 'train';
  saveState();
  render();
}

function startEmptySession(date) {
  // (drafts are discarded silently when starting a new session — undo via toast if needed)
  state.draft = {
    id: uid(),
    date: date || todayISO(),
    dayId: null,
    dayName: '',
    createdAt: Date.now(),
    exercises: [],
  };
  state.activeId = null;
  state.view = 'train';
  saveState();
  pendingFocus = '#new-exercise-name';
  render();
}

function saveDraft() {
  if (!state.draft) return;
  const session = state.draft;
  state.sessions.push(session);
  state.activeId = session.id;
  state.draft = null;
  sortSessions();
  saveState();
  render();
  showInfoToast(`Workout saved · ${formatVolume(sessionVolume(session))} kg`);
}

function discardDraft() {
  if (!state.draft) return;
  const draftBackup = state.draft;
  state.draft = null;
  saveState();
  render();
  showUndoToast('Draft discarded', () => {
    state.draft = draftBackup;
    saveState();
    render();
  });
}

function createDefaultSets(count, reps, machineWeight, plateWeight) {
  const sets = [];
  const n = Math.max(1, Math.min(20, Number(count) || 1));
  for (let i = 0; i < n; i++) {
    sets.push({
      id: uid(),
      reps: reps || '',
      machineWeight: machineWeight || '',
      plateWeight: plateWeight || '',
      complete: false,
    });
  }
  return sets;
}

function setActiveSession(id) {
  state.activeId = id;
  state.view = 'train';
  saveState();
  render();
}

function closeSession() {
  state.activeId = null;
  saveState();
  render();
}

function deleteSession(id) {
  const idx = state.sessions.findIndex(s => s.id === id);
  if (idx < 0) return;
  const removed = state.sessions[idx];
  state.sessions.splice(idx, 1);
  if (state.activeId === id) state.activeId = null;
  saveState();
  render();
  showUndoToast('Session deleted', () => {
    state.sessions.push(removed);
    sortSessions();
    saveState();
    render();
  });
}

function setSessionDate(id, date) {
  const s = getEditingSession(id);
  if (!s || !date) return;
  s.date = date;
  if (!isDraftId(id)) sortSessions();
  saveState();
  render();
}

function setSessionDayName(id, name) {
  const s = getEditingSession(id);
  if (!s) return;
  s.dayName = name;
  saveState();
}

function addSessionExercise(sessionId, name) {
  const s = getEditingSession(sessionId);
  if (!s) return;
  s.exercises.push({
    id: uid(),
    name: name || '',
    sets: [{ id: uid(), reps: '', machineWeight: '', plateWeight: '', complete: false }],
  });

  pendingFocus = '#new-exercise-name';
  render();
}

function deleteSessionExercise(sessionId, exId) {
  const s = getEditingSession(sessionId);
  if (!s) return;
  const idx = s.exercises.findIndex(e => e.id === exId);
  if (idx < 0) return;
  const removed = s.exercises[idx];
  s.exercises.splice(idx, 1);
  saveState();
  render();
  showUndoToast(`Removed "${removed.name || 'exercise'}"`, () => {
    const sx = getEditingSession(sessionId);
    if (!sx) return;
    sx.exercises.splice(idx, 0, removed);
    saveState();
    render();

function updateSessionExerciseName(sessionId, exId, name) {
  const s = getEditingSession(sessionId);
  const ex = s?.exercises.find(e => e.id === exId);
  if (!ex) return;
  ex.name = name;
  saveState();
}

function addSessionSet(sessionId, exId) {
  const s = getEditingSession(sessionId);
  const ex = s?.exercises.find(e => e.id === exId);
  if (!ex) return;
  const last = ex.sets[ex.sets.length - 1];
  const newSet = {
    id: uid(),
    reps: last?.reps ?? '',
    machineWeight: last?.machineWeight ?? '',

function deleteSessionSet(sessionId, exId, setId) {
  const s = getEditingSession(sessionId);
  const ex = s?.exercises.find(e => e.id === exId);
  if (!ex) return;
  ex.sets = ex.sets.filter(set => set.id !== setId);
  saveState();
  render();
}

function updateSessionSet(sessionId, exId, setId, field, value) {
  const s = getEditingSession(sessionId);
  const ex = s?.exercises.find(e => e.id === exId);
  const set = ex?.sets.find(x => x.id === setId);
  if (!set) return;
  set[field] = value === '' ? '' : Number(value);
  saveState();
}

function toggleSessionSet(sessionId, exId, setId) {
  const s = getEditingSession(sessionId);
  const ex = s?.exercises.find(e => e.id === exId);
  const set = ex?.sets.find(x => x.id === setId);
  if (!set) return;
  set.complete = !set.complete;
  saveState();
  render();

function setView(view) {

  state.view = view;
  saveState();
  render();
}

function showUndoToast(message, undoFn) {
  const toast = $('#toast');
  toast.innerHTML = `<span>${escapeHtml(message)}</span><button class="toast-action" id="toast-undo">Undo</button>`;
  toast.classList.add('show');

/* ────────────────────────────────────────────
   EXPORT / IMPORT (manual cross-device sync)
   ──────────────────────────────────────────── */

function exportJSON() {
  const data = {
    schema: STORAGE_KEY,
    exportedAt: new Date().toISOString(),
    state: {
      split: state.split,
      sessions: state.sessions,
      activeId: state.activeId,
    },
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymlog-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showInfoToast('Backup downloaded');
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      applyImportedData(parsed, { confirmFirst: true });
      showInfoToast('Data imported successfully');
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.onerror = () => alert('Could not read file');
  reader.readAsText(file);
}

function buildExportPayload() {
  return {
    schema: STORAGE_KEY,
    exportedAt: new Date().toISOString(),
    state: {
      split: state.split,
      sessions: state.sessions,
      activeId: state.activeId,
    },
  };
}

function applyImportedData(parsed, { confirmFirst = false } = {}) {
  const incoming = parsed.state || parsed;
  const sessions = Array.isArray(incoming.sessions) ? incoming.sessions : null;
  const split = incoming.split && Array.isArray(incoming.split.days) ? incoming.split : null;
  if (!sessions || !split) throw new Error('Not a valid GymLog backup');
  if (confirmFirst) {
    const ok = confirm(
      `Import ${sessions.length} session${sessions.length === 1 ? '' : 's'} and ${split.days.length} split day${split.days.length === 1 ? '' : 's'}?\n\nThis will REPLACE all current data on this device.`
    );
    if (!ok) return false;
  }
  state.sessions = sessions;
  state.split = split;
  state.activeId = incoming.activeId || null;
  sortSessions();
  saveState({ skipAutoSync: true });
  ensureValid();
  render();
  return true;
}
